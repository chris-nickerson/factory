name: Verify Factory
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s tests -v
      - run: ./factory doctor --profile local
      - name: Qualify upgrade from the release before role bindings
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        shell: bash
        run: |
          baseline=d2d9ab90eac801c6a13559fb144efb17095923ff
          archived_checkout=$(mktemp -d)
          git fetch --no-tags --depth=1 origin "$baseline"
          git archive "$baseline" | tar -x -C "$archived_checkout"
          python -B evals/qualify_upgrade.py "$archived_checkout"
